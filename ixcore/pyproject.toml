[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ixcore"
version = "0.1.0"
description = "Core foundation package providing LLM connections, utilities, and output formatting"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ix", email = "ix@ixmachina.ai"}
]

dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.21.0",
    "ixutils>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ixcore*"]

