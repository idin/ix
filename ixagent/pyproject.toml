[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ixagent"
version = "0.1.0"
description = "Agent package for building chatbot-style interactions with LLMs, tool calling, and conversation management"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ix", email = "ix@ixmachina.ai"}
]

dependencies = [
    "ixcore>=0.1.0",
    "ixutils>=0.1.0",
    "ixmemory>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ixagent*"]

