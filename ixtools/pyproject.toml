[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ixtools"
version = "0.1.0"
description = "Tools package providing reusable functions that can be used with agents for various tasks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ix", email = "ix@ixmachina.ai"}
]

dependencies = [
    "ixutils>=0.1.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "ddgs>=1.0.0",
    "rapidfuzz>=3.0.0",
    "mutagen>=1.47.0",
    "Pillow>=10.0.0",
    "numpy>=1.20.0",
    "pandas>=2.0.0",
    "pyarrow>=10.0.0",
    "openpyxl>=3.0.0",
    "pyyaml>=6.0.0",
    "graphviz>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ixtools*"]

